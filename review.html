<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복습하기 - 수학 오답 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(203, 213, 225, 0.5);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .glass-card-dark {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(51, 65, 85, 0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out;
        }
        .review-card {
            transition: all 0.3s;
        }
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            backface-visibility: hidden;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="glass-card-dark text-white shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between py-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-calculator text-2xl"></i>
                    <h1 class="text-2xl font-bold">수학 오답노트</h1>
                </div>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-home mr-2"></i>홈
                    </a>
                    <a href="register.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-plus-circle mr-2"></i>오답 등록
                    </a>
                    <a href="problems.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-list mr-2"></i>오답 목록
                    </a>
                    <a href="report.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-chart-bar mr-2"></i>분석 리포트
                    </a>
                    <a href="review.html" class="hover:text-blue-200 transition border-b-2 border-white">
                        <i class="fas fa-redo mr-2"></i>복습하기
                    </a>
                </div>
                <button id="mobileMenuBtn" class="md:hidden">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="glass-card rounded-3xl shadow-2xl p-8 mb-8 animate-fade-in">
            <h2 class="text-4xl font-bold mb-3 gradient-text">
                <i class="fas fa-redo mr-2"></i>오답 복습하기
            </h2>
            <p class="text-gray-600 text-lg">틀린 문제를 다시 풀어보고 실력을 향상시키세요.</p>
        </div>

        <!-- Review Mode Selection -->
        <div id="modeSelection" class="glass-card rounded-3xl shadow-2xl p-8 mb-8 animate-fade-in" style="animation-delay: 0.1s;">
            <h3 class="text-xl font-bold text-gray-800 mb-4">복습 모드 선택</h3>
            
            <!-- Student Selection -->
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">학생 선택</label>
                <select id="reviewStudent" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <option value="">학생을 선택하세요</option>
                    <option value="student1">첫째 아들</option>
                    <option value="student2">둘째 아들</option>
                </select>
            </div>

            <!-- Review Strategy -->
            <div class="grid md:grid-cols-3 gap-4 mb-4">
                <button onclick="startReview('priority')" class="p-6 border-2 border-blue-200 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition text-center">
                    <i class="fas fa-exclamation-circle text-4xl text-blue-600 mb-3"></i>
                    <h4 class="font-bold text-gray-800 mb-2">우선순위 복습</h4>
                    <p class="text-sm text-gray-600">복습이 가장 필요한 문제부터</p>
                </button>

                <button onclick="startReview('random')" class="p-6 border-2 border-green-200 rounded-lg hover:border-green-500 hover:bg-green-50 transition text-center">
                    <i class="fas fa-random text-4xl text-green-600 mb-3"></i>
                    <h4 class="font-bold text-gray-800 mb-2">랜덤 복습</h4>
                    <p class="text-sm text-gray-600">무작위로 섞어서 풀기</p>
                </button>

                <button onclick="startReview('difficult')" class="p-6 border-2 border-red-200 rounded-lg hover:border-red-500 hover:bg-red-50 transition text-center">
                    <i class="fas fa-fire text-4xl text-red-600 mb-3"></i>
                    <h4 class="font-bold text-gray-800 mb-2">어려운 문제</h4>
                    <p class="text-sm text-gray-600">난이도 '상' 문제만</p>
                </button>
            </div>

            <!-- Custom Filter -->
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="font-semibold text-gray-800 mb-3">필터 옵션</h4>
                <div class="grid md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm text-gray-700 mb-1">과목/단원</label>
                        <input type="text" id="reviewSubject" placeholder="예: 방정식" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-700 mb-1">난이도</label>
                        <select id="reviewDifficulty" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            <option value="">전체</option>
                            <option value="상">상</option>
                            <option value="중">중</option>
                            <option value="하">하</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-700 mb-1">문제 수</label>
                        <input type="number" id="reviewCount" value="10" min="1" max="50" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                    </div>
                </div>
                <button onclick="startReview('custom')" class="mt-6 w-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 text-white py-3 rounded-2xl font-bold hover:scale-105 transition shadow-2xl border border-white/20">
                    <i class="fas fa-play mr-2"></i>맞춤 복습 시작
                </button>
            </div>
        </div>

        <!-- Review Session -->
        <div id="reviewSession" class="hidden">
            <!-- Progress Bar -->
            <div class="glass-card rounded-3xl shadow-2xl p-6 mb-8">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-semibold text-gray-700">진행 상황</span>
                    <span class="text-sm font-semibold text-gray-700">
                        <span id="currentProblemNum">0</span> / <span id="totalProblemsNum">0</span>
                    </span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all" style="width: 0%"></div>
                </div>
            </div>

            <!-- Problem Card -->
            <div id="problemCard" class="glass-card rounded-3xl shadow-2xl p-8 mb-6">
                <div class="mb-6">
                    <div class="flex items-center justify-between mb-4">
                        <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold" id="problemSubject"></span>
                        <span class="px-3 py-1 rounded-full text-sm font-semibold" id="problemDifficulty"></span>
                    </div>
                    <h3 class="text-xl font-bold text-gray-800 mb-4">문제</h3>
                    <div id="problemContent" class="text-gray-700 mb-4 whitespace-pre-wrap"></div>
                    <div id="problemImage" class="hidden mb-4">
                        <img id="problemImageSrc" class="max-w-full rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Answer Input -->
                <div class="border-t pt-6">
                    <label class="block text-gray-700 font-semibold mb-2">내 답</label>
                    <input type="text" id="userAnswer" placeholder="답을 입력하세요..." class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg">
                </div>

                <!-- Show Answer Button -->
                <div class="mt-6">
                    <button onclick="showAnswer()" id="showAnswerBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                        <i class="fas fa-eye mr-2"></i>정답 확인
                    </button>
                </div>

                <!-- Answer Section (Hidden Initially) -->
                <div id="answerSection" class="hidden mt-6 border-t pt-6">
                    <div class="bg-green-50 border-2 border-green-200 rounded-lg p-4 mb-4">
                        <h4 class="font-bold text-green-800 mb-2">
                            <i class="fas fa-check-circle mr-2"></i>정답
                        </h4>
                        <p class="text-green-700 text-lg" id="correctAnswerText"></p>
                    </div>

                    <div class="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-4 mb-4">
                        <h4 class="font-bold text-yellow-800 mb-2">
                            <i class="fas fa-lightbulb mr-2"></i>이전에 틀린 이유
                        </h4>
                        <p class="text-yellow-700" id="mistakeReasonText"></p>
                    </div>

                    <!-- Result Selection -->
                    <div class="mb-4">
                        <h4 class="font-semibold text-gray-800 mb-3">이번 복습 결과는?</h4>
                        <div class="grid grid-cols-3 gap-3">
                            <button onclick="submitReview('정답')" class="py-3 bg-green-100 text-green-700 rounded-lg font-semibold hover:bg-green-200 transition">
                                <i class="fas fa-check mr-2"></i>맞음
                            </button>
                            <button onclick="submitReview('부분정답')" class="py-3 bg-yellow-100 text-yellow-700 rounded-lg font-semibold hover:bg-yellow-200 transition">
                                <i class="fas fa-minus mr-2"></i>부분맞음
                            </button>
                            <button onclick="submitReview('오답')" class="py-3 bg-red-100 text-red-700 rounded-lg font-semibold hover:bg-red-200 transition">
                                <i class="fas fa-times mr-2"></i>틀림
                            </button>
                        </div>
                    </div>

                    <!-- Notes -->
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">복습 메모 (선택)</label>
                        <textarea id="reviewNotes" rows="3" placeholder="이번 복습에서 느낀 점이나 추가 메모..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex space-x-4">
                <button onclick="exitReview()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                    <i class="fas fa-stop mr-2"></i>복습 종료
                </button>
            </div>
        </div>

        <!-- Review Complete -->
        <div id="reviewComplete" class="hidden glass-card rounded-3xl shadow-2xl p-12 text-center animate-fade-in">
            <i class="fas fa-trophy text-6xl text-yellow-500 mb-4"></i>
            <h3 class="text-3xl font-bold text-gray-800 mb-4">복습 완료!</h3>
            <p class="text-gray-600 mb-6">수고하셨습니다. 꾸준한 복습으로 실력이 향상될 거예요!</p>
            
            <!-- Review Summary -->
            <div class="grid md:grid-cols-3 gap-4 mb-6">
                <div class="bg-green-50 rounded-lg p-4">
                    <p class="text-sm text-gray-600 mb-1">정답</p>
                    <p class="text-2xl font-bold text-green-700" id="resultCorrect">0</p>
                </div>
                <div class="bg-yellow-50 rounded-lg p-4">
                    <p class="text-sm text-gray-600 mb-1">부분정답</p>
                    <p class="text-2xl font-bold text-yellow-700" id="resultPartial">0</p>
                </div>
                <div class="bg-red-50 rounded-lg p-4">
                    <p class="text-sm text-gray-600 mb-1">오답</p>
                    <p class="text-2xl font-bold text-red-700" id="resultWrong">0</p>
                </div>
            </div>

            <div class="flex space-x-4">
                <button onclick="location.reload()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                    <i class="fas fa-redo mr-2"></i>다시 복습하기
                </button>
                <button onclick="location.href='index.html'" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
                    <i class="fas fa-home mr-2"></i>홈으로
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-card-dark text-slate-200 py-8 mt-16 border-t border-white/10">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 수학 오답노트. 체계적인 학습 관리 시스템</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/review.js"></script>
</body>
</html>
