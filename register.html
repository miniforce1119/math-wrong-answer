<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오답 등록 - 수학 오답 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(203, 213, 225, 0.5);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .glass-card-dark {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(51, 65, 85, 0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="glass-card-dark text-white shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between py-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-calculator text-2xl"></i>
                    <h1 class="text-2xl font-bold">수학 오답노트</h1>
                </div>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-home mr-2"></i>홈
                    </a>
                    <a href="register.html" class="hover:text-blue-200 transition border-b-2 border-white">
                        <i class="fas fa-plus-circle mr-2"></i>오답 등록
                    </a>
                    <a href="problems.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-list mr-2"></i>오답 목록
                    </a>
                    <a href="report.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-chart-bar mr-2"></i>분석 리포트
                    </a>
                    <a href="review.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-redo mr-2"></i>복습하기
                    </a>
                </div>
                <button id="mobileMenuBtn" class="md:hidden">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="glass-card rounded-3xl shadow-2xl p-8 mb-8 animate-fade-in">
                <h2 class="text-4xl font-bold mb-3 gradient-text">
                    <i class="fas fa-plus-circle mr-2"></i>오답 문제 등록
                </h2>
                <p class="text-gray-600 text-lg">틀린 문제를 등록하고 체계적으로 관리하세요.</p>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" class="glass-card rounded-3xl shadow-2xl p-8 space-y-6 animate-fade-in" style="animation-delay: 0.1s;">
                <!-- Student Selection -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-user mr-2"></i>학생 선택 *
                    </label>
                    <select id="studentId" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">학생을 선택하세요</option>
                        <option value="student1">첫째 아들 (초등학교 6학년)</option>
                        <option value="student2">둘째 아들 (초등학교 3학년)</option>
                    </select>
                </div>

                <!-- Date -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-calendar mr-2"></i>문제 풀이 날짜 *
                    </label>
                    <input type="date" id="solvedDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Subject/Unit -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-book mr-2"></i>과목/단원 *
                    </label>
                    <input type="text" id="subject" required placeholder="예: 방정식, 함수, 도형의 성질 등" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Problem Type -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-tag mr-2"></i>문제 유형
                    </label>
                    <input type="text" id="problemType" placeholder="예: 계산 문제, 응용 문제, 증명 등" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Difficulty -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-signal mr-2"></i>난이도 *
                    </label>
                    <div class="flex space-x-4">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="difficulty" value="하" required class="mr-2">
                            <span class="px-4 py-2 bg-green-100 text-green-700 rounded-lg">하</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="difficulty" value="중" class="mr-2">
                            <span class="px-4 py-2 bg-yellow-100 text-yellow-700 rounded-lg">중</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="difficulty" value="상" class="mr-2">
                            <span class="px-4 py-2 bg-red-100 text-red-700 rounded-lg">상</span>
                        </label>
                    </div>
                </div>

                <!-- Source -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-map-marker-alt mr-2"></i>출처
                    </label>
                    <input type="text" id="source" placeholder="예: 학원 숙제, 학교 시험, 자습 문제집 등" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Problem Content (Text or Image) -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-pen mr-2"></i>문제 내용
                    </label>
                    <div class="mb-4">
                        <div class="flex space-x-4 mb-4">
                            <button type="button" id="textModeBtn" class="flex-1 py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                                <i class="fas fa-keyboard mr-2"></i>텍스트 입력
                            </button>
                            <button type="button" id="imageModeBtn" class="flex-1 py-2 px-4 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                                <i class="fas fa-image mr-2"></i>이미지 업로드
                            </button>
                        </div>
                        
                        <!-- Text Input Mode -->
                        <div id="textMode">
                            <textarea id="content" rows="6" placeholder="문제 내용을 입력하세요..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                        </div>

                        <!-- Image Input Mode -->
                        <div id="imageMode" class="hidden">
                            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                                <input type="file" id="imageInput" accept="image/*" class="hidden">
                                <button type="button" onclick="document.getElementById('imageInput').click()" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                                    <i class="fas fa-upload mr-2"></i>이미지 선택
                                </button>
                                <p class="text-gray-500 mt-2 text-sm">또는</p>
                                <input type="url" id="imageUrl" placeholder="이미지 URL을 입력하세요" class="mt-2 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div id="imagePreview" class="mt-4 hidden">
                                <img id="previewImg" class="preview-image mx-auto rounded-lg shadow-md">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- My Answer -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-pencil-alt mr-2"></i>내가 쓴 답
                    </label>
                    <input type="text" id="myAnswer" placeholder="예: 5, x=3, 45도 등" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Correct Answer -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-check-circle mr-2"></i>정답
                    </label>
                    <input type="text" id="correctAnswer" placeholder="정답을 입력하세요" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- Mistake Reason -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-exclamation-triangle mr-2"></i>틀린 이유
                    </label>
                    <textarea id="mistakeReason" rows="4" placeholder="왜 틀렸는지, 어떤 개념이 부족한지 등을 기록하세요..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>

                <!-- Tags -->
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">
                        <i class="fas fa-tags mr-2"></i>태그
                    </label>
                    <input type="text" id="tags" placeholder="태그를 쉼표로 구분하여 입력 (예: 실수, 개념부족, 계산오류)" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <p class="text-sm text-gray-500 mt-1">태그는 쉼표(,)로 구분하여 입력하세요</p>
                </div>

                <!-- Submit Buttons -->
                <div class="flex space-x-4 pt-6">
                    <button type="submit" class="flex-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 text-white py-4 px-6 rounded-2xl font-bold hover:scale-105 transition shadow-2xl border border-white/20">
                        <i class="fas fa-save mr-2"></i>등록하기
                    </button>
                    <button type="button" onclick="window.location.href='index.html'" class="flex-1 glass-card text-gray-700 py-4 px-6 rounded-2xl font-bold hover:scale-105 transition shadow-lg">
                        <i class="fas fa-times mr-2"></i>취소
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-card-dark text-slate-200 py-8 mt-16 border-t border-white/10">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 수학 오답노트. 체계적인 학습 관리 시스템</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
