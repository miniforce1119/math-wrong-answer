<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오답 목록 - 수학 오답 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(203, 213, 225, 0.5);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .glass-card-dark {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(51, 65, 85, 0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .problem-card {
            transition: transform 0.2s;
        }
        .problem-card:hover {
            transform: translateY(-2px);
        }
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="glass-card-dark text-white shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between py-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-calculator text-2xl"></i>
                    <h1 class="text-2xl font-bold">수학 오답노트</h1>
                </div>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-home mr-2"></i>홈
                    </a>
                    <a href="register.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-plus-circle mr-2"></i>오답 등록
                    </a>
                    <a href="problems.html" class="hover:text-blue-200 transition border-b-2 border-white">
                        <i class="fas fa-list mr-2"></i>오답 목록
                    </a>
                    <a href="report.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-chart-bar mr-2"></i>분석 리포트
                    </a>
                    <a href="review.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-redo mr-2"></i>복습하기
                    </a>
                </div>
                <button id="mobileMenuBtn" class="md:hidden">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="glass-card rounded-3xl shadow-2xl p-8 mb-8">
            <h2 class="text-4xl font-bold mb-3" style="background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                <i class="fas fa-list mr-2"></i>오답 문제 목록
            </h2>
            <p class="text-gray-600 text-lg">등록된 모든 오답 문제를 확인하고 관리하세요.</p>
        </div>

        <!-- Filters and Search -->
        <div class="glass-card rounded-3xl shadow-2xl p-8 mb-8">
            <div class="grid md:grid-cols-4 gap-4">
                <!-- Student Filter -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">학생</label>
                    <select id="filterStudent" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">전체</option>
                        <option value="student1">첫째 아들</option>
                        <option value="student2">둘째 아들</option>
                    </select>
                </div>

                <!-- Difficulty Filter -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">난이도</label>
                    <select id="filterDifficulty" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">전체</option>
                        <option value="상">상</option>
                        <option value="중">중</option>
                        <option value="하">하</option>
                    </select>
                </div>

                <!-- Mastery Filter -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">마스터 상태</label>
                    <select id="filterMastered" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">전체</option>
                        <option value="false">학습 중</option>
                        <option value="true">완전 이해</option>
                    </select>
                </div>

                <!-- Sort -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">정렬</label>
                    <select id="sortBy" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="-registered_date">최근 등록순</option>
                        <option value="-solved_date">풀이 날짜순</option>
                        <option value="difficulty">난이도순</option>
                        <option value="-review_count">복습 많은순</option>
                    </select>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="mt-4">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="과목, 문제 유형, 태그로 검색..." class="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    <i class="fas fa-search absolute left-4 top-4 text-gray-400"></i>
                </div>
            </div>

            <!-- Filter Button -->
            <div class="mt-4">
                <button onclick="applyFilters()" class="w-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 text-white py-3 px-6 rounded-2xl font-bold hover:scale-105 transition shadow-2xl border border-white/20">
                    <i class="fas fa-filter mr-2"></i>필터 적용
                </button>
            </div>
        </div>

        <!-- Statistics Summary -->
        <div class="grid md:grid-cols-4 gap-6 mb-8">
            <div class="glass-card rounded-2xl shadow-lg p-6 hover-lift">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">전체 오답</p>
                        <p class="text-2xl font-bold text-gray-800" id="totalCount">0</p>
                    </div>
                    <i class="fas fa-clipboard-list text-3xl text-blue-500"></i>
                </div>
            </div>
            <div class="glass-card rounded-2xl shadow-lg p-6 hover-lift">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">이번 달</p>
                        <p class="text-2xl font-bold text-gray-800" id="monthCount">0</p>
                    </div>
                    <i class="fas fa-calendar-alt text-3xl text-green-500"></i>
                </div>
            </div>
            <div class="glass-card rounded-2xl shadow-lg p-6 hover-lift">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">복습 필요</p>
                        <p class="text-2xl font-bold text-gray-800" id="needReviewCount">0</p>
                    </div>
                    <i class="fas fa-exclamation-triangle text-3xl text-yellow-500"></i>
                </div>
            </div>
            <div class="glass-card rounded-2xl shadow-lg p-6 hover-lift">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">완전 이해</p>
                        <p class="text-2xl font-bold text-gray-800" id="masteredCount">0</p>
                    </div>
                    <i class="fas fa-check-circle text-3xl text-purple-500"></i>
                </div>
            </div>
        </div>

        <!-- Problems List -->
        <div id="problemsList" class="space-y-4">
            <!-- Problems will be loaded here -->
            <div class="text-center py-12 glass-card rounded-3xl shadow-2xl">
                <i class="fas fa-spinner fa-spin text-4xl text-gray-400 mb-4"></i>
                <p class="text-gray-600">문제를 불러오는 중...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-6 flex justify-center space-x-2">
            <!-- Pagination will be loaded here -->
        </div>
    </main>

    <!-- Problem Detail Modal -->
    <div id="problemModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-2xl font-bold text-gray-800">오답 상세 정보</h3>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <div id="modalContent">
                    <!-- Modal content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="glass-card-dark text-slate-200 py-8 mt-16 border-t border-white/10">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 수학 오답노트. 체계적인 학습 관리 시스템</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/problems.js"></script>
</body>
</html>
