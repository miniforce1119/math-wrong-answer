<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 리포트 - 수학 오답 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(203, 213, 225, 0.5);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .glass-card-dark {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(51, 65, 85, 0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="glass-card-dark text-white shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between py-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-calculator text-2xl"></i>
                    <h1 class="text-2xl font-bold">수학 오답노트</h1>
                </div>
                <div class="hidden md:flex space-x-6">
                    <a href="index.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-home mr-2"></i>홈
                    </a>
                    <a href="register.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-plus-circle mr-2"></i>오답 등록
                    </a>
                    <a href="problems.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-list mr-2"></i>오답 목록
                    </a>
                    <a href="report.html" class="hover:text-blue-200 transition border-b-2 border-white">
                        <i class="fas fa-chart-bar mr-2"></i>분석 리포트
                    </a>
                    <a href="review.html" class="hover:text-blue-200 transition">
                        <i class="fas fa-redo mr-2"></i>복습하기
                    </a>
                </div>
                <button id="mobileMenuBtn" class="md:hidden">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="glass-card rounded-3xl shadow-2xl p-8 mb-8 animate-fade-in">
            <h2 class="text-4xl font-bold mb-3 gradient-text">
                <i class="fas fa-chart-bar mr-2"></i>학습 분석 리포트
            </h2>
            <p class="text-gray-600 text-lg">오답 현황을 분석하고 학습 패턴을 파악하세요.</p>
        </div>

        <!-- Period Selection -->
        <div class="glass-card rounded-3xl shadow-2xl p-8 mb-8 animate-fade-in" style="animation-delay: 0.1s;">
            <div class="grid md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">학생 선택</label>
                    <select id="reportStudent" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">전체</option>
                        <option value="student1">첫째 아들</option>
                        <option value="student2">둘째 아들</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">기간 선택</label>
                    <select id="periodSelect" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="this_month">이번 달</option>
                        <option value="last_month">지난 달</option>
                        <option value="last_3months">최근 3개월</option>
                        <option value="last_6months">최근 6개월</option>
                        <option value="this_year">올해</option>
                        <option value="all">전체</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">시작 날짜</label>
                    <input type="date" id="startDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">종료 날짜</label>
                    <input type="date" id="endDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <button onclick="loadReport()" class="mt-6 w-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 text-white py-3 px-6 rounded-2xl font-bold hover:scale-105 transition shadow-2xl border border-white/20">
                <i class="fas fa-sync-alt mr-2"></i>리포트 생성
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="grid md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-lg shadow-md p-6 text-white">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-sm opacity-90">총 오답 수</p>
                    <i class="fas fa-clipboard-list text-2xl opacity-75"></i>
                </div>
                <p class="text-3xl font-bold" id="summaryTotal">0</p>
            </div>
            <div class="bg-gradient-to-br from-green-500 to-green-600 rounded-lg shadow-md p-6 text-white">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-sm opacity-90">평균 난이도</p>
                    <i class="fas fa-signal text-2xl opacity-75"></i>
                </div>
                <p class="text-3xl font-bold" id="summaryAvgDifficulty">-</p>
            </div>
            <div class="bg-gradient-to-br from-yellow-500 to-yellow-600 rounded-lg shadow-md p-6 text-white">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-sm opacity-90">복습 필요</p>
                    <i class="fas fa-exclamation-triangle text-2xl opacity-75"></i>
                </div>
                <p class="text-3xl font-bold" id="summaryNeedReview">0</p>
            </div>
            <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-lg shadow-md p-6 text-white">
                <div class="flex items-center justify-between mb-2">
                    <p class="text-sm opacity-90">마스터율</p>
                    <i class="fas fa-check-circle text-2xl opacity-75"></i>
                </div>
                <p class="text-3xl font-bold" id="summaryMasteryRate">0%</p>
            </div>
        </div>

        <!-- Charts Row 1 -->
        <div class="grid md:grid-cols-2 gap-6 mb-6">
            <!-- Monthly Trend Chart -->
            <div class="glass-card rounded-3xl shadow-2xl p-8">
                <h3 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-chart-line text-blue-600 mr-2"></i>월별 오답 추이
                </h3>
                <div style="height: 300px;">
                    <canvas id="monthlyTrendChart"></canvas>
                </div>
            </div>

            <!-- Difficulty Distribution -->
            <div class="glass-card rounded-3xl shadow-2xl p-8">
                <h3 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-chart-pie text-green-600 mr-2"></i>난이도별 분포
                </h3>
                <div style="height: 300px;">
                    <canvas id="difficultyChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Charts Row 2 -->
        <div class="grid md:grid-cols-2 gap-6 mb-6">
            <!-- Subject Distribution -->
            <div class="glass-card rounded-3xl shadow-2xl p-8">
                <h3 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-book text-purple-600 mr-2"></i>과목/단원별 오답
                </h3>
                <div style="height: 300px;">
                    <canvas id="subjectChart"></canvas>
                </div>
            </div>

            <!-- Review Status -->
            <div class="glass-card rounded-3xl shadow-2xl p-8">
                <h3 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-redo text-orange-600 mr-2"></i>복습 현황
                </h3>
                <div style="height: 300px;">
                    <canvas id="reviewStatusChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Top Problems -->
        <div class="glass-card rounded-3xl shadow-2xl p-8 mb-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-fire text-red-600 mr-2"></i>가장 많이 틀린 단원 TOP 5
            </h3>
            <div id="topSubjects" class="space-y-3">
                <!-- Top subjects will be loaded here -->
            </div>
        </div>

        <!-- Common Mistake Tags -->
        <div class="glass-card rounded-3xl shadow-2xl p-8">
            <h3 class="text-xl font-bold text-gray-800 mb-4">
                <i class="fas fa-tags text-indigo-600 mr-2"></i>자주 나타나는 실수 유형
            </h3>
            <div id="commonTags" class="flex flex-wrap gap-2">
                <!-- Common tags will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="glass-card-dark text-slate-200 py-8 mt-16 border-t border-white/10">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 수학 오답노트. 체계적인 학습 관리 시스템</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/report.js"></script>
</body>
</html>
